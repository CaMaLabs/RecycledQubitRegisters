name: QRR fresh N22 full-outcome tail QPE freeze then score

on:
  push:
    paths:
      - .github/workflows/qrr-n22-full-tail-holdout.yml
  workflow_dispatch:

concurrency:
  group: qrr-n22-fresh-fulloutcome-tail-v1
  cancel-in-progress: false

jobs:
  freeze-public-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      freeze_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure credentials
        uses: tracebit-com/tracebit-community-action@1e35e4fdc6f29832b20ce3e62d85164c32a16a21
        with:
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: admin
          profile-region: us-east-1
          async: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate public-only fresh 22bit classical survivor manifest
        shell: bash
        run: |
          set -o pipefail
          python3 -m py_compile hardware/dark_star_n22_full_tail_public_manifest.py
          python3 -u hardware/dark_star_n22_full_tail_public_manifest.py | tee n22_full_tail_public_freeze.log
      - name: Verify no selected overlap and no factor/order/model metadata
        run: |
          python3 - <<'PY'
          import hashlib,json,math
          from pathlib import Path
          root=Path('results/dark_star_ptp')
          d=json.loads((root/'dark_star_n22_full_tail_public_manifest.json').read_text())
          old=json.loads((root/'dark_star_n22_public_manifest.json').read_text())
          exclusions={r['N'] for r in old['selected_public_rows']}
          selected=d['selected_public_rows']
          assert len(selected)==4 and len({r['N'] for r in selected})==4
          assert d['zero_QPU'] and d['qpu_jobs_submitted']==0
          assert exclusions==set(d['previous_n22_excluded'])
          assert not exclusions.intersection({r['N'] for r in selected})
          for group in ('trigger','control'):
              rows=[r for r in selected if r['group']==group]
              screen=d['public_screenings'][group]
              assert len(rows)==2 and len(screen)<=300
              assert sum(not r['public_B31_factored'] for r in screen)==2
              assert {r['N'] for r in rows}.issubset({r['N'] for r in screen})
              for r in rows:
                  assert set(r)=={'N','base','group','rank','public_policies'}
                  assert 1<<21<=r['N']<1<<22
                  assert r['N']%3==(2 if group=='trigger' else 1)
                  assert math.gcd(r['N'],r['base'])==1
                  assert r['public_policies']=={'plain':r['base'],'cube':pow(r['base'],3,r['N'])}
          canonical=json.dumps(selected,sort_keys=True,separators=(',',':'))
          assert hashlib.sha256(canonical.encode()).hexdigest()==d['selected_sha256']
          print('PUBLIC MANIFEST ONLY',d['selected_sha256'])
          PY
      - name: Commit fresh N-only manifest strictly BEFORE any validation/scoring
        id: commit
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/dark_star_ptp/dark_star_n22_full_tail_public_manifest.json
          git commit -m "research(freeze): fresh n22 public sample before full-outcome tail quantum scores"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qrr-n22-full-tail-public-only-manifest
          path: |
            n22_full_tail_public_freeze.log
            results/dark_star_ptp/dark_star_n22_full_tail_public_manifest.json

  bounded-fulloutcome-score:
    needs: freeze-public-selection
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [trigger, control]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.freeze-public-selection.outputs.freeze_sha }}
      - name: Configure credentials
        uses: tracebit-com/tracebit-community-action@1e35e4fdc6f29832b20ce3e62d85164c32a16a21
        with:
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: admin
          profile-region: us-east-1
          async: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU numpy and numba for fast PUBLIC factor-CF checks
        run: python3 -m pip install numpy==2.1.3 numba==0.61.2
      - name: Verify preregistration and Python compile before scoring
        run: |
          test -s docs/DARK_STAR_N22_FULL_OUTCOME_BOUNDED_PREREG.md
          test -s results/dark_star_ptp/dark_star_n22_full_tail_public_manifest.json
          python3 -m py_compile hardware/dark_star_n22_full_tail_qpe_holdout.py
      - name: Score complete-outcome ideal-QPE head and omitted-mass with sampling confidence
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -o pipefail
          python3 -u hardware/dark_star_n22_full_tail_qpe_holdout.py --group "$GROUP" | tee "n22_full_tail_${GROUP}.log"
      - name: Validate original 2 fresh public samples and all uncertainty/mathematical controls
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          python3 - <<'PY'
          import json,math,os
          from pathlib import Path
          group=os.environ['GROUP']
          root=Path('results/dark_star_ptp')
          x=json.loads((root/f'dark_star_n22_full_tail_{group}.json').read_text())
          m=json.loads((root/'dark_star_n22_full_tail_public_manifest.json').read_text())
          assert x['group']==group and x['public_manifest_sha256']==m['selected_sha256']
          assert x['zero_QPU'] and x['qpu_jobs_submitted']==0
          assert x['selftests']['passed'] and x['selftests']['public_certificates_match_slow_factor_verifier']
          assert x['outcome_half_window']==32 and x['samples']==16384
          assert x['alpha']==0.01
          assert len(x['rows'])==2
          assert x['summary']['selected']==2 and x['summary']['additional_classically_factored']==2
          assert x['logical_width']=={'arithmetic_workspace':69,'wide_peak':113,'recycled_peak':70}
          assert [r['N'] for r in x['rows']]==[r['N'] for r in m['selected_public_rows'] if r['group']==group]
          for r in x['rows']:
              n,a=r['N'],r['base']
              assert n%3==(2 if group=='trigger' else 1)
              assert math.gcd(a,n)==1
              assert r['public_policies']=={'plain':a,'cube':pow(a,3,n)}
              assert r['additional_public_classical']['classically_factored']
              assert n%r['additional_public_classical']['factor']==0
              assert r['validation_only']['known_odd_power_identity']
              assert r['validation_only']['cube_order']==r['validation_only']['plain_order']//math.gcd(r['validation_only']['plain_order'],3)
              for name in ('plain','cube'):
                  v=r[name]
                  a,b=v['factor_probability_by_cap_interval']
                  assert 0<=a<=b<=1
                  ca,cb=v['modeled_CCX_attempt_interval']
                  assert 0<=ca<=cb+1e-6
                  assert len(v['all_stages'])==21
                  assert v['all_stages'][0]['m']==4 and v['all_stages'][-1]['m']==44
                  if v['exact_factor_incapable']:
                      assert a==b==0
                  for z in v['all_stages']:
                      assert 0<=z['lower']<=z['upper']<=1+1e-9
                      if z['mode']=='seeded_iid_uniform_eigenphase_estimate':
                          assert z['n_eigenphase_values']==16384
                          assert z['eigenphase_Hoeffding_epsilon']==x['eigenphase_hoeffding_epsilon']
                          assert z['omission_upper_bound']==1/63
                      if z['mode']=='exact_all_bin_FFT':
                          assert abs(z['fft_normalization']-1)<1e-9
              cmp=r['cube_vs_plain']
              if cmp['status']=='cube_model_win':assert cmp['ratio'][1]<1
              if cmp['status']=='cube_model_loss':assert cmp['ratio'][0]>1
          print('VERIFIED FROZEN PUBLIC N22 fresh full-outcome-tail confidence with zero-QPU',group)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qrr-n22-full-tail-${{ matrix.group }}
          path: |
            n22_full_tail_*.log
            results/dark_star_ptp/dark_star_n22_full_tail_*.json
