name: QRR N35 coherent four-phase inverse QFT readout native CPU ZERO QPU

on:
  push:
    paths:
      - .github/workflows/qrr-n35-four-wide-iqft-readout-zero-qpu.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qrr-n35-four-wide-iqft-readout-v1-zeroqpu
  cancel-in-progress: false

jobs:
  public-four-wide-readout:
    name: Public N35 base ${{ matrix.base }} exact wide-QPE QFT dagger and 4 phase measures, Fez CPU native 8 pairs
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        base: [2,8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SAME pinned native CPU target Qiskit environment
        run: python -m pip install "qiskit~=2.5.2" "qiskit-ibm-runtime~=0.47.0"
      - name: Original prereg, no QPU policy, old frozen 35 qubit raw reports
        run: |
          test -s docs/QRR_N35_FULL_FOUR_PHASE_IQFT_READOUT_PREREG.md
          python -m py_compile hardware/qrr_n35_four_phase_iqft_readout_cpu.py
          python - <<'PY'
          from pathlib import Path
          s=Path('hardware/qrr_n35_four_phase_iqft_readout_cpu.py').read_text()
          assert all(q not in s for q in ('SamplerV2','EstimatorV2','sampler.run','job.submit','job.run','job.result','backend.run'))
          assert 'Operator(QFTGate(4).inverse())' in s
          assert 'np.exp(-2j*np.pi*phase)/4.0' in s
          assert 'prior.phase_source_preflight' in s
          assert 'prior.exhaustive_four_controlled_power_phase' in s
          assert 'q.compose(power' in s and 'q.measure(bit,measured[i])' in s
          assert 'SEEDS=(239,647,1453,3701,6211,9421,16673,27191)' in s
          for b in (2,8):
              f=Path(f'results/ibm_shor35_four_power_sign_selector/qrr_n35_four_power_sign_source_base{b}.json')
              assert f.exists() and f.stat().st_size>0
          print('ALL SOURCE/PREREG/HISTORIC four-block CPU reports present; no QPU')
          PY
      - name: Check analytic 16x16 QFT inverse, literal source complex phase+1, compile 8 matched full readout pairs CPU only
        shell: bash
        env:
          BASE: ${{ matrix.base }}
          IBM_QUANTUM_API_KEY: ${{ secrets.IBM_QUANTUM_API_KEY }}
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=25s 650s python -u hardware/qrr_n35_four_phase_iqft_readout_cpu.py --base "$BASE" | tee "qrr_n35_four_wide_iqft_base${BASE}.log"
      - name: Independent source/quantum/measure and all eight native compiler pair audits against original frozen block
        env:
          BASE: ${{ matrix.base }}
        run: |
          python - <<'PY'
          import json,os,statistics
          from pathlib import Path
          b=int(os.environ['BASE'])
          old=json.loads(Path(f'results/ibm_shor35_four_power_sign_selector/qrr_n35_four_power_sign_source_base{b}.json').read_text())
          d=json.loads(Path(f'results/ibm_shor35_four_phase_iqft_readout/qrr_n35_four_phase_iqft_base{b}.json').read_text())
          seeds=[239,647,1453,3701,6211,9421,16673,27191]
          assert d['revision']=='qrr-n35-four-control-wide-phase-iqft-measure-v1-20261020'
          assert d['preregistered_document']=='docs/QRR_N35_FULL_FOUR_PHASE_IQFT_READOUT_PREREG.md'
          assert d['public_N']==35 and d['public_base']==b
          assert d['research_lead']=='Chase Lunsford / CaMaLabs'
          assert d['source_logical_qubits']==35 and d['source_classical_bits']==4
          assert d['seeds']==seeds and d['optimization_level']==1 and d['backend_target']=='ibm_fez'
          assert d['no_midcircuit_recycling_or_feedback']
          assert d['no_measurement_outcomes_sampled'] and d['number_of_factor_recoveries_measured']==0
          assert d['true_order_not_injected'] and d['private_factors_not_used'] and d['orbit_not_injected']
          assert d['zero_QPU'] and d['qpu_jobs_submitted']==0 and not d['free_runtime_used'] and not d['paid_runtime_used']
          assert d['frozen_native_CZ_cutoff']==800 and d['frozen_native_depth_cutoff']==2000
          assert d['analytic_inverse_QFT_prebackend']['pass_all']
          assert d['analytic_inverse_QFT_prebackend']['actual_QFT_and_inverse_exact_DFT_matrices']
          assert d['analytic_inverse_QFT_prebackend']['H4_uniform_positive_16_amplitudes']
          assert d['analytic_inverse_QFT_prebackend']['actual_inverse_times_QFT_identity']
          assert d['source_all_phase_prechecks_completed']
          assert d['prebackend_phase_proofs']['source_histograms_exactly_frozen']
          assert d['prebackend_phase_proofs']['four_power_schedule_exactly_frozen']
          assert d['prebackend_phase_proofs']['public_source_safety']['all_proofs_pass_before_any_IBM_backend_access']
          for x in ('old_source','selected_source'):
              p=d['prebackend_phase_proofs'][x]
              q=old['four_power_source_phase_proofs']['original' if x=='old_source' else 'selected']
              assert p['pass_all'] and p['exact_complex_phase_plus_one']
              assert p['exact_source_operator_basis_cases']==1024
              assert p['source_gate_histogram']==q['source_gate_histogram']
              assert p['all_25_helpers_clean']
          for x in ('original','selected'):
              p=d['prebackend_readout_structure'][x]
              assert p['pass_all'] and p['source_qubits']==35 and p['source_classical_bits']==4
              assert p['exactly_four_terminal_measurements'] and p['four_H_initial_phase_preparations']
              assert p['initial_work_basis_one'] and p['older_power_block_unmodified']
              assert p['neither_recycled_phase_nor_semiclassical_feedback']
              assert p['public_multiplier_schedule']==old['public_power_schedule']
          assert d['status']=='COMPILE_SUCCESS' and d['success'] and d['no_QPU_jobs_generated']
          rows=d['native_seed_pairs']
          assert len(rows)==8 and [r['seed'] for r in rows]==seeds
          oldpairs=old['eight_seed_native_pairs']
          assert d['source_original_four_power_native_seed_metrics']==oldpairs
          deltas_cz=[];deltas_depth=[]
          for i,row in enumerate(rows):
              assert oldpairs[i]['seed']==row['seed']
              for label in ('original','selected'):
                  x=row[label]
                  assert x['native_cz']>0 and x['native_depth']>0
                  assert x['compiled_device_width']==d['backend_device_qubits']
                  assert x['compiled_classical_bits']==4 and x['native_ops']['measure']==4
                  assert x['exactly_four_native_terminal_measurements']
                  assert x['native_ops']['cz']==x['native_cz']
                  assert x['native_total_ops']>0 and x['compiler_seconds']>=0
                  assert row[f'{label}_device_feasible']==(x['native_cz']<=800 and x['native_depth']<=2000)
                  archived=oldpairs[i][label]
                  assert row['archived_no_QFT_same_seed_descriptive_only'][f'{label}_archived_CZ']==archived['native_cz']
                  assert row['archived_no_QFT_same_seed_descriptive_only'][f'{label}_archived_depth']==archived['native_depth']
                  assert row['full_minus_historical_noQFT_delta_descriptive_only'][f'{label}_CZ']==x['native_cz']-archived['native_cz']
                  assert row['full_minus_historical_noQFT_delta_descriptive_only'][f'{label}_depth']==x['native_depth']-archived['native_depth']
              z=row['selected']['native_cz']-row['original']['native_cz']
              dep=row['selected']['native_depth']-row['original']['native_depth']
              assert row['paired_delta']==dict(cz=z,depth=dep)
              assert row['jointly_CZ_and_depth_lower']==(z<0 and dep<0)
              deltas_cz.append(z);deltas_depth.append(dep)
          s=d['summary']
          assert s['pairs']==8
          assert s['paired_joint_both_resource_wins']==sum(z<0 and dep<0 for z,dep in zip(deltas_cz,deltas_depth))
          assert s['median_paired_CZ_delta']==statistics.median(deltas_cz)
          assert s['median_paired_depth_delta']==statistics.median(deltas_depth)
          assert s['robustness_both_cz_and_depth_gate_pass']==(
              s['paired_joint_both_resource_wins']>=6
              and s['median_paired_CZ_delta']<0
              and s['median_paired_depth_delta']<0)
          assert s['all_qpu_preflights_fail'] is True
          print('INDEPENDENT N35 COMPLETED FOUR-WIDE IQFT READOUT',b,
                'four measured cbit, old+selected 1024 phase correct, native 8 pairs;',
                'joint wins',s['paired_joint_both_resource_wins'],
                'median CZ/depth',s['median_paired_CZ_delta'],s['median_paired_depth_delta'],
                'robust',s['robustness_both_cz_and_depth_gate_pass'],'QPU FAIL and 0 jobs')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qrr-n35-four-wide-iqft-base${{ matrix.base }}-original
          path: |
            qrr_n35_four_wide_iqft_base*.log
            results/ibm_shor35_four_phase_iqft_readout/qrr_n35_four_phase_iqft_base*.json
