name: QRR N35 public shared carry cleanup 8192+1584+128 gate tests ZERO QPU

on:
  push:
    paths:
      - .github/workflows/qrr-n35-shared-carry-borrow-zero-qpu.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qrr-n35-public-shared-carry-clean-borrow-zero-qpu-v1
  cancel-in-progress: false

jobs:
  public-base-original-and-cube:
    name: N35 base ${{ matrix.base }} shared forward carry and clean borrow ZERO QPU
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        base: [2, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact IBM Fez native target compiler package versions
        run: python -m pip install "qiskit~=2.5.2" "qiskit-ibm-runtime~=0.47.0"
      - name: Frozen prereg, all-gate proof source and STRICT no-device submission boundary
        run: |
          test -s docs/QRR_N35_SHARED_CARRY_REUSE_PREREG.md
          python -m py_compile hardware/qrr_n35_shared_carry_borrow_single_modmul.py
          python - <<'PY'
          from pathlib import Path
          s=Path('hardware/qrr_n35_shared_carry_borrow_single_modmul.py').read_text()
          assert all(x not in s for x in ('SamplerV2','EstimatorV2','sampler.run','job.submit','job.run','job.result'))
          assert 'exhaustive_shared_carry_adder_gate_proof' in s
          assert 'combined.exhaustive_modadd_gate_test' in s
          assert 'verified.exhaustive_actual_gate_proof' in s
          assert 'combined.constant_add_from_prefix_carry=constant_add_shared_carry' in s
          for b in (2,8):
              path=f'results/ibm_shor35_public_prefix_carry/qrr_n35_public_prefix_carry_base{b}.json'
              assert Path(path).exists(),path
          print('Only public, zero-QPU, immutable baseline results and prereg')
          PY
      - name: Exact reversible gate-level 8192+1584+128 proofs then READ-only IBM Fez CPU compiler
        shell: bash
        env:
          IBM_QUANTUM_API_KEY: ${{ secrets.IBM_QUANTUM_API_KEY }}
          BASE: ${{ matrix.base }}
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=25s 480s python -u hardware/qrr_n35_shared_carry_borrow_single_modmul.py --base "$BASE" \
            | tee "qrr_n35_shared_carry_base${BASE}.log"
      - name: Independently compare reported all-gate proofs and backend ISA to old immutable source
        env:
          BASE: ${{ matrix.base }}
        run: |
          python - <<'PY'
          import os,json,math
          from pathlib import Path
          base=int(os.environ['BASE'])
          path=Path(f'results/ibm_shor35_shared_carry_borrow/qrr_n35_shared_carry_borrow_base{base}.json')
          d=json.loads(path.read_text())
          old=json.loads(Path(f'results/ibm_shor35_public_prefix_carry/qrr_n35_public_prefix_carry_base{base}.json').read_text())
          assert d['revision']=='qrr-n35-shared-carry-clean-borrow-v1-20261017'
          assert d['research_lead']=='Chase Lunsford / CaMaLabs'
          assert d['preregistration']=='docs/QRR_N35_SHARED_CARRY_REUSE_PREREG.md'
          assert d['N']==35 and d['base']==base
          assert d['true_order_not_used'] and d['orbit_encoding_not_used']
          assert d['qpu_jobs_submitted']==0 and d['paid_runtime_authorized']==False
          assert d['original_cached_control_layout_unchanged']
          assert d['previous_baseline']==dict(cz=old['native_cz'],depth=old['native_depth'],
               primitive=old['complete_multiplier_proof']['primitive_gate_count'],logical=old['application_logical_qubits'])
          assert d['target_backend']=='ibm_fez' and d['optimization_level']==1 and d['seed_transpiler']==8776
          x=d['public_mod2n_adder_gate_proof']
          assert x['passed'] and x['real_instruction_interpreter']
          assert x['constants']==64 and x['inputs_per_constant']==128
          assert x['actual_emitted_gate_cases']==8192 and x['carry_scratch_all_clean']
          assert all(z['all_128_cases_pass'] for z in x['original_gates_by_constant'])
          m=d['public_mod35_adder_gate_proof']
          assert m['pass_all'] and m['real_instruction_interpreter']
          assert m['unique_count']==16 and m['ideal_gate_cases']==1584 and m['all_aux_clean']
          f=d['complete_multiplier_proof']
          assert f['pass_all'] and f['actual_emitted_instruction_interpreter']
          assert f['exhaustive_control_residue_inputs']==128 and f['all_aux_25_clean']
          assert set(f['source_primitive_gate_counts'])=={'x','cx','ccx'}
          assert d['application_logical_qubits']==32
          assert d['status']=='COMPILE_SUCCESS' and d['success']
          assert d['native_cz']>0 and d['native_depth']>0
          assert d['native_ops']['cz']==d['native_cz']
          assert d['frozen_device_cz']==800 and d['frozen_device_depth']==2000
          assert d['engineering_pass']==(d['native_cz']<old['native_cz'] and d['native_depth']<old['native_depth'])
          assert d['hardware_feasibility_pass']==(d['native_cz']<=800 and d['native_depth']<=2000)
          assert math.isclose(d['cz_saving_pct'],100*(old['native_cz']-d['native_cz'])/old['native_cz'])
          print('AUDITED SHARED CARRY ORIGINAL',base,'8192+1584+128 emitted gate cases PASSED',
              'old CZ',old['native_cz'],'new CZ',d['native_cz'],
              'old DEPTH',old['native_depth'],'new DEPTH',d['native_depth'],
              'engineering',d['engineering_pass'],'hardware',d['hardware_feasibility_pass'],'ZERO QPU')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qrr-n35-shared-carry-original-base${{ matrix.base }}
          path: |
            qrr_n35_shared_carry_base*.log
            results/ibm_shor35_shared_carry_borrow/qrr_n35_shared_carry_borrow_base*.json
