name: A26 Fourier kernel audit
on:
  workflow_dispatch:
  push:
    branches:
      - agent/a24-darkstar-n35-cost-audit-20261030
    paths:
      - 'hardware/qrr_a26_fourier_kernel_audit.py'
      - '.github/workflows/a26_fourier_kernel.yml'
jobs:
  a26-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exact Fourier arithmetic kernel tests
        run: |
          set -euo pipefail
          python3 hardware/qrr_a26_fourier_kernel_audit.py --max-bits 4 | tee a26_kernel_results.json
          python3 - <<'PY'
          import json
          with open("a26_kernel_results.json") as f:
              report=json.load(f)
          assert all(row["verified"] for row in report["rows"])
          assert sum(row["checked_inputs"] for row in report["rows"]) == 340
          assert report["qpu_jobs"] == 0
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: a26-kernel-results
          path: a26_kernel_results.json
