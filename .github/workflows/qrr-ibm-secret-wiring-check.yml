name: QRR verify IBM credential secret binding only (never print secret)
on:
  push:
    paths:
      - .github/workflows/qrr-ibm-secret-wiring-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-secret-wiring-no-api-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check exact repository secret name without exposing the value
        shell: bash
        env:
          EXPECTED_SECRET: ${{ secrets.IBM_QUANTUM_API_KEY }}
        run: |
          set +x
          if [ -n "$EXPECTED_SECRET" ]; then
            echo 'IBM_QUANTUM_API_KEY_AVAILABLE=true'
          else
            echo 'IBM_QUANTUM_API_KEY_AVAILABLE=false'
          fi
          echo 'NO IBM API calls, QPU jobs or runtime usage from this workflow.'
