name: QRR N35 relative-phase comparator ripple carries ZERO QPU

on:
  push:
    paths:
      - .github/workflows/qrr-n35-relative-phase-ripple-carry-zero-qpu.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qrr-n35-relative-phase-ripple-carry-v1
  cancel-in-progress: false

jobs:
  two-public-bases:
    name: public base ${{ matrix.base }} comparator 42672 + modadd1584 + full128 complex-unitary gates
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        base: [2,8]
    steps:
      - uses: actions/checkout@v4
      - name: Configure credentials
        uses: tracebit-com/tracebit-community-action@1e35e4fdc6f29832b20ce3e62d85164c32a16a21
        with:
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: admin
          profile-region: us-east-1
          async: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned source unitary and target compilation tools
        run: python -m pip install "qiskit~=2.5.2" "qiskit-ibm-runtime~=0.47.0"
      - name: Check prereg, phase proof, zero-QPU source and original 2-arm receipts
        run: |
          test -s docs/QRR_N35_RELATIVE_PHASE_RIPPLE_CARRY_PREREG.md
          python -m py_compile hardware/qrr_n35_relative_phase_ripple_carry.py
          python - <<'PY'
          from pathlib import Path
          s=Path('hardware/qrr_n35_relative_phase_ripple_carry.py').read_text()
          assert all(word not in s for word in ('SamplerV2','EstimatorV2','sampler.run','job.submit','job.run','job.result'))
          assert "primitive.predicate = phase_aware_ripple_predicate" in s
          assert "primitive.multi_x = " not in s
          assert "Operator(gate)" in s and "check_exact_phase" in s
          assert "qc.append(rccx" in s and "qc.append(inverse" in s
          assert "exhaustive_comparator_phase_proof" in s
          assert "exhaustive_modadd_phases" in s and "exhaustive_full_multiplier_phases" in s
          for b in (2,8):
              old=Path(f"results/ibm_shor35_public_prefix_carry/qrr_n35_public_prefix_carry_base{b}.json")
              assert old.exists(),old
          print('Original validated baseline; source unitary phase gate checks, no QPU')
          PY
      - name: Verify exact phase, all clean auxiliaries, and compile read-only IBM Fez TARGET (no quantum runtime)
        shell: bash
        env:
          BASE: ${{ matrix.base }}
          IBM_QUANTUM_API_KEY: ${{ secrets.IBM_QUANTUM_API_KEY }}
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=25s 480s python -u hardware/qrr_n35_relative_phase_ripple_carry.py --base "$BASE" | tee "qrr_n35_phase_ripple_base${BASE}.log"
      - name: Audit 42672+1584+128 phase-exact gate proof and immutable compiler baselines
        env:
          BASE: ${{ matrix.base }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          b=int(os.environ['BASE'])
          d=json.loads(Path(f"results/ibm_shor35_relative_phase_ripple/qrr_n35_relative_phase_clean_vchain_base{b}.json").read_text())
          old=json.loads(Path(f"results/ibm_shor35_public_prefix_carry/qrr_n35_public_prefix_carry_base{b}.json").read_text())
          assert d['revision']=='qrr-n35-relative-phase-ripple-carry-v1-20261017'
          assert d['preregistration']=='docs/QRR_N35_RELATIVE_PHASE_RIPPLE_CARRY_PREREG.md'
          assert d['N']==35 and d['base']==b
          assert d['true_multiplicative_order_not_injected'] and d['orbit_not_precomputed']
          assert d['relative_phase_rccx_only_inside_temporary_comparator_carries']
          assert d['no_quantum_runtime_submission'] and not d['paid_runtime_used'] and d['qpu_jobs_submitted']==0
          assert d['read_only_target']=='ibm_fez'
          assert d['frozen_transpiler_optimization_level']==1 and d['frozen_transpiler_seed']==8776
          assert d['original_compiled_baseline']==dict(cz=old['native_cz'],depth=old['native_depth'],
              primitive=old['complete_multiplier_proof']['primitive_gate_count'],
              logical=old['application_logical_qubits'])
          p=d['comparator_phase_proof']
          assert p['pass_all'] and p['actual_gate_comparator_cases']==42672
          assert p['comparator_source_circuits']==240 and p['rccx_inside_comparator_present']
          assert p['exact_complex_phase_plus_one'] and p['all_carry_scratch_clean']
          m=d['public_modadd_phase_proof']
          assert m['pass_all'] and m['source_gate_cases']==1584 and m['unique_constants']==16
          assert m['clean_helpers'] and m['exact_complex_phase_plus_one']
          f=d['full_modmul_phase_proof']
          assert f['pass_all'] and f['full_residue_control_basis_cases']==128
          assert f['all_25_auxiliaries_clean'] and f['exact_complex_output_phase_plus_one']
          assert f['quantum_source_gate_counts'].get('rccx',0)>0, f['quantum_source_gate_counts']
          assert d['source_logical_qubits']==32
          assert d['status']=='COMPILE_SUCCESS' and d['success']
          assert d['native_cz']>0 and d['native_depth']>0
          assert d['compiled_native_ops']['cz']==d['native_cz']
          assert d['native_cz_device_limit']==800 and d['native_depth_device_limit']==2000
          assert d['engineering_both_costs_improve']==(
              d['native_cz']<old['native_cz'] and d['native_depth']<old['native_depth'])
          assert d['device_feasibility_gate']==(d['native_cz']<=800 and d['native_depth']<=2000)
          print('PHASE-EXACT AUDIT base',b,'42,672 compare +1584 modadd +128 full',
             'rccx whole',f['quantum_source_gate_counts']['rccx'],
             'old/new CZ',old['native_cz'],d['native_cz'],
             'old/new depth',old['native_depth'],d['native_depth'],
             'engineering',d['engineering_both_costs_improve'],
             'hardware',d['device_feasibility_gate'],'ZERO QPU')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qrr-n35-phase-ripple-base${{ matrix.base }}-original
          path: |
            qrr_n35_phase_ripple_base*.log
            results/ibm_shor35_relative_phase_ripple/qrr_n35_relative_phase_clean_vchain_base*.json
