name: Autonomous optimizer tests
on:
  push:
    paths: ['competition/optimizer/**', '.github/workflows/autonomous-optimizer-tests.yml']
  pull_request:
    paths: ['competition/optimizer/**', '.github/workflows/autonomous-optimizer-tests.yml']
  workflow_dispatch:
jobs:
  exact-and-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r competition/optimizer/requirements-optional.txt
      - run: python -m unittest discover -s competition/optimizer/tests -v
