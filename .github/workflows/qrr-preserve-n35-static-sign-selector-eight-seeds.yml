name: Independently audit/preserve original N35 static public sign selector ROBUST 16 of 16 paired wins

on:
  push:
    paths:
      - .github/workflows/qrr-preserve-n35-static-sign-selector-eight-seeds.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: qrr-n35-static-source-sign-original-eight-seed-preserve
  cancel-in-progress: false

jobs:
  independently-audit-original-byte-accurate-source-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve authentic ORIGINAL two-base source-run JSON artifacts; no recompile
        uses: actions/download-artifact@v4
        with:
          run-id: 39367204317
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: qrr-n35-static-gate-sign-selector-base*-original
          merge-multiple: true
          path: _source_original_artifacts
      - name: Copy exactly two source results without numerical rewriting
        run: |
          set -euo pipefail
          mkdir -p results/ibm_shor35_static_gate_sign_selector
          for base in 2 8; do
            fn="qrr_n35_static_sign_selector_base${base}.json"
            count="$(find _source_original_artifacts -type f -name "$fn" | wc -l)"
            test "$count" -eq 1 || { echo "Expected precisely one original $fn; found $count"; exit 1; }
            find _source_original_artifacts -type f -name "$fn" -exec cp -t results/ibm_shor35_static_gate_sign_selector/ '{}' +
          done
      - name: Independently verify 32 exact source native metrics, 34 public k proxy scores, complex phases and historical 8776 reproduction
        run: |
          python3 - <<'PY'
          import json,statistics
          from pathlib import Path
          seeds=[11,37,101,409,8776,12011,20261,45673]
          originals={
            2:[
                (7932,18529,7393,16747),
                (7875,18757,7046,16266),
                (7955,18618,7228,16211),
                (7676,18220,7003,16331),
                (7887,18221,6871,16626),
                (7737,18413,7057,16004),
                (7744,18497,7325,17043),
                (8135,19192,6881,16125)],
            8:[
                (8242,18553,7254,16234),
                (8321,19496,7013,16181),
                (7604,18627,7025,16380),
                (8156,19775,7385,16865),
                (7802,18449,7315,16286),
                (8137,18982,7375,16619),
                (8328,19457,7384,16500),
                (8290,19122,7671,17700)]
          }
          medians={2:(-703.5,-2148.0),8:(-766.5,-2341.0)}
          expected_8776={2:(7887,18221),8:(7802,18449)}
          expected_signed_weighted={2:6,8:7}
          for b in (2,8):
              d=json.loads(Path(f'results/ibm_shor35_static_gate_sign_selector/qrr_n35_static_sign_selector_base{b}.json').read_text())
              old=json.loads(Path(f'results/ibm_shor35_one_bit_carry_bypass_multiseed/qrr_n35_one_bit_carry_bypass_base{b}.json').read_text())
              assert d['revision']=='qrr-n35-static-source-gate-sign-selector-v1-20261019'
              assert d['research_lead']=='Chase Lunsford / CaMaLabs'
              assert d['preregistration']=='docs/QRR_N35_STATIC_GATE_COST_SIGN_SELECTOR_PREREG.md'
              assert d['N']==35 and d['base']==b and d['seeds']==seeds
              assert d['source_score_formula']=='cx+6*ccx+3*rccx; x excluded; ties choose positive'
              assert d['read_only_ibm_fez_native_target'] and d['compiler_optimization_level']==1
              assert d['transpiler_target']=='ibm_fez'
              assert d['original_historical_8776']['cz']==expected_8776[b][0]
              assert d['original_historical_8776']['depth']==expected_8776[b][1]
              assert d['original_historical_8776']['source']==old['exact_source_complex_proofs']['candidate_full_multiplier_phase_proof']['quantum_source_gate_counts']
              assert d['true_multiplicative_order_not_used'] and d['public_orbit_not_compiled'] and d['private_prime_factors_not_used']
              assert d['qpu_jobs_submitted']==0 and not d['quantum_runtime_used'] and not d['paid_runtime_used']
              assert d['hardware_cz_limit']==800 and d['hardware_depth_limit']==2000
              assert d['status']=='COMPILE_SUCCESS' and d['success'] and d['all_16_native_cpu_compiles_complete']
              tbl=d['prebackend_public_k_source_score_table']
              choices=d['public_k_sign_selection']
              assert len(tbl)==34 and len(choices)==34
              assert {int(k):v for k,v in choices.items()}=={k:('signed' if k%2 else 'positive') for k in range(1,35)}
              assert d['selector_static_score_summary']['signed_count']==17
              assert d['selector_static_score_summary']['positive_count']==17
              assert d['selector_static_score_summary']['source_weights']==dict(cx=1,ccx=6,rccx=3,x=0)
              for k,entry in enumerate(tbl,1):
                  assert entry['public_k']==k
                  assert entry['selected_branch']==choices[str(k)]
                  for branch in ('positive','signed'):
                      op=entry[branch+'_gate_counts']
                      expected=op.get('cx',0)+6*op.get('ccx',0)+3*op.get('rccx',0)
                      assert entry[branch+'_static_proxy']==expected
                  assert entry['selected_branch']==(
                      'signed' if entry['signed_static_proxy']<entry['positive_static_proxy'] else 'positive')
              p=d['prebackend_exact_quantum_gate_proofs']
              assert p['public_identity']['pass_all'] and p['public_identity']['cases']==3366
              assert p['unchanged_comparator']['pass_all']
              assert p['unchanged_comparator']['actual_emitted_gate_cases']==42672
              assert p['unchanged_comparator']['final_complex_phase_plus_one_every_case']
              assert p['both_branches_per_k']['pass_all'] and p['both_branches_per_k']['total_quantum_operator_basis_cases']==6732
              assert p['both_branches_per_k']['exact_complex_phase_plus_one'] and p['both_branches_per_k']['all_aux_clean']
              assert len(p['both_branches_per_k']['per_public_k'])==34
              for proofrow in p['both_branches_per_k']['per_public_k']:
                  assert proofrow['positive']['pass_all'] and proofrow['signed']['pass_all']
                  assert proofrow['positive']['cases']==99 and proofrow['signed']['cases']==99
                  assert proofrow['positive']['phase_exact_plus_one'] and proofrow['signed']['phase_exact_plus_one']
                  assert proofrow['positive']['all_aux_clean'] and proofrow['signed']['all_aux_clean']
              full=p['whole_full_multiplier']
              assert full['pass_all'] and full['both_source_circuits_32_qubits']
              assert full['both_return_all_25_ancillas_clean']
              assert full['both_full_input_complex_phases_exactly_plus_one']
              assert full['actual_signed_weighted_additions']==expected_signed_weighted[b]
              assert full['actual_positive_weighted_additions']==12-expected_signed_weighted[b]
              assert len(full['weighted_public_constants'])==12
              assert full['selection_for_each_weight']==[choices[str(k)] for k in full['weighted_public_constants']]
              for name in ('original_full','candidate_full'):
                  pf=full[name]
                  assert pf['pass_all'] and pf['full_residue_control_basis_cases']==128
                  assert pf['exact_complex_output_phase_plus_one'] and pf['all_25_auxiliaries_clean']
              assert full['original_full']['quantum_source_gate_counts']==d['original_historical_8776']['source']
              assert p['everything_complex_phase_exactly_plus_one'] and p['all_helpers_clean']
              rows=d['matched_seed_pairs']
              assert len(rows)==8 and [z['seed'] for z in rows]==seeds
              czdelta=[];depthdelta=[]
              for i,row in enumerate(rows):
                  ref=row['original'];candidate=row['candidate']
                  assert (ref['cz'],ref['depth'],candidate['cz'],candidate['depth'])==originals[b][i],(b,i,row)
                  oldcase=old['eight_pairs'][i]['candidate']
                  assert ref['cz']==oldcase['cz'] and ref['depth']==oldcase['depth']
                  for variant in ('original','candidate'):
                      cost=row[variant]
                      assert cost['cz']>0 and cost['depth']>0
                      assert cost['native_ops']['cz']==cost['cz']
                      assert cost['device_width']==d['fez_device_qubits']==156
                      assert cost['native_size']>0 and cost['compiler_seconds']>=0
                      assert row[variant+'_hardware_feasible']==(cost['cz']<=800 and cost['depth']<=2000)
                  dc=candidate['cz']-ref['cz'];dd=candidate['depth']-ref['depth']
                  czdelta.append(dc);depthdelta.append(dd)
                  assert row['candidate_minus_original']==dict(cz=dc,depth=dd)
                  assert row['both_cz_and_depth_strictly_improve']==(dc<0 and dd<0)
              s=d['summary']
              assert s['total_seed_pairs']==8 and s['every_seed_reported']
              assert s['joint_cz_depth_improvement_seed_count']==8
              assert s['cz_improvement_seeds']==8 and s['depth_improvement_seeds']==8
              assert s['joint_win_rule_at_least_six']
              assert s['paired_cz_and_depth_medians_negative']
              assert s['median_paired_cz_delta']==statistics.median(czdelta)==medians[b][0]
              assert s['median_paired_depth_delta']==statistics.median(depthdelta)==medians[b][1]
              assert s['min_paired_cz_delta']==min(czdelta) and s['max_paired_cz_delta']==max(czdelta)
              assert s['min_paired_depth_delta']==min(depthdelta) and s['max_paired_depth_delta']==max(depthdelta)
              assert s['original_8776_anchor_exact'] and not s['original_anchor_drift']
              assert s['weighted_modadd_source_changes_nonzero']
              assert s['robust_gate_per_base_pass']
              assert s['all_source_and_candidate_layouts_fail_hardware_gate']
              print('VERIFIED ORIGINAL N35',b,'all 34 prebackend public k score tables, signed weighted',
                    expected_signed_weighted[b],
                    '3366 arithmetic, 42672 comparator, 6732 dual-k, 128+128 full true operator phase checks',
                    '8/8 matched CZ+depth wins, median',medians[b],
                    '8776 exact anchor, all hardware fails, NO QPU',flush=True)
          print('SUCCESS: independently verified original both-base 32 native CPU compile readings, source complex phases, original pristine numerical artifacts')
          PY
      - name: Commit ORIGINAL results without rescoring scientific work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/ibm_shor35_static_gate_sign_selector/qrr_n35_static_sign_selector_base2.json
          git add results/ibm_shor35_static_gate_sign_selector/qrr_n35_static_sign_selector_base8.json
          if ! git diff --cached --quiet; then
            git commit -m 'results: independent verify/preserve 34-public-constant static signed gate selector N35 exact unitary, 16-of-16 robust CZ/depth gains and hardware failure'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
