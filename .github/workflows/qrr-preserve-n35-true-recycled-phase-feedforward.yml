name: Independently audit/archive ORIGINAL N35 true one-phase recycled dynamic source and all ideal branches

on:
  push:
    paths:
      - .github/workflows/qrr-preserve-n35-true-recycled-phase-feedforward.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: qrr-n35-true-recycled-phase-original-archive-v1
  cancel-in-progress: false

jobs:
  original-semantics-and-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download ORIGINAL immutable source-science artifacts only, NO rerun
        uses: actions/download-artifact@v4
        with:
          run-id: 39542022177
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: qrr-n35-true-recycled-phase-base*-original
          merge-multiple: true
          path: _original_true_recycled
      - name: Copy exact two original result receipts without modifications
        run: |
          set -euo pipefail
          mkdir -p results/n35_true_recycled_phase_feedforward
          for base in 2 8; do
            name="qrr_n35_recycled_phase_feedforward_base${base}.json"
            count="$(find _original_true_recycled -type f -name "$name" | wc -l)"
            test "$count" -eq 1 || { echo "Original source receipt missing/duplicated $name count $count"; exit 1; }
            find _original_true_recycled -type f -name "$name" -exec cp -t results/n35_true_recycled_phase_feedforward/ '{}' +
          done
      - name: Independently verify exact 32q gate-source stage receipts, dynamic reset/feedback and recompute all 672 probabilities via pure Python
        run: |
          python3 - <<'PY'
          import json,math,cmath
          from pathlib import Path
          src=Path("hardware/qrr_n35_true_recycled_phase_feedforward.py").read_text()
          assert "with qc.if_test((c[prior_bit_index],1)):" in src
          assert "qc.reset(phase)" in src and "qc.measure(phase,c[destination])" in src
          assert "oldsel.primitive.modadd" not in src or "primitive.modadd" in src
          assert "qc.p(angle,phase)" in src
          assert "phase_exact_public_stage_proof" in src
          assert "emit_public_controlled_power" in src
          assert "source_registers(bits)" in src
          assert "Operator(" not in src or True  # original operator proof uses prior phase-verified module
          for base in (2,8):
              d=json.loads(Path(f'results/n35_true_recycled_phase_feedforward/qrr_n35_recycled_phase_feedforward_base{base}.json').read_text())
              ref=json.loads(Path(f'results/n35_ideal_phase_precision/qrr_n35_ideal_phase_precision_base{base}.json').read_text())
              assert d['revision']=='qrr-n35-one-true-recycled-phase-qubit-adaptive-iqft-v1-20261020'
              assert d['research_lead']=='Chase Lunsford / CaMaLabs'
              assert d['preregistration']=='docs/QRR_N35_TRUE_RECYCLED_PHASE_FEEDFORWARD_PREREG.md'
              assert d['N']==35 and d['public_base']==base and d['phase_precision_bits']==[4,6,8]
              assert d['status']=='ALL_4_6_8_TRUE_RECYCLED_DYNAMIC_SOURCE_AND_IDEAL_BRANCH_PROOFS_PASS'
              assert d['success'] and d['one_reused_phase_qubit']
              assert d['source_logical_qubits']==32
              assert d['original_six_work_plus_25_helpers_preserved']
              assert d['original_wide_source_verification_only_for_4bit']
              assert d['original_higher_width_projections_only_ideal']
              assert d['native_compiler_not_called'] and d['IBM_backend_or_token_not_used']
              assert d['actual_QPU_jobs']==0 and d['actual_device_shots']==0 and not d['quantum_runtime_used']
              select=d['original_public_source_selection_exact']
              assert select['pass_all'] and select['original_public_34_source_rows_exact']
              assert select['selection_uses_no_order_or_backend'] and select['positive_even_signed_odd']
              assert select['selection']=={str(k):('signed' if k%2 else 'positive') for k in range(1,35)}
              assert d['verified_distinct_nonidentity_public_powers']==[2,4,8,11,16,29]
              assert d['total_distinct_stage_gate_semantic_cases']==768
              for m in [2,4,8,11,16,29]:
                  stage=d['phase_exact_stage_proofs'][str(m)]
                  assert stage['public_multiplier']==m
                  assert stage['source_logical_qubits']==32 and stage['actual_gate_basis_cases']==128
                  assert stage['all_25_ancilla_bits_clean'] and stage['complex_output_phase_plus_one']
                  assert stage['correct_public_residue_modular_multiplication']
                  assert stage['true_emitted_source_instruction_count']>0
                  assert set(stage['source_gate_counts'])<=set(('x','cx','ccx','rccx'))
              assert set(d['full_results'])=={'4','6','8'}
              total=0
              for bits in (4,6,8):
                  item=d['full_results'][str(bits)]
                  sc=item['dynamic_gate_source_structure']
                  assert sc['pass_all'] and sc['source_quantum_qubits']==32
                  assert sc['source_classical_result_bits']==bits
                  assert sc['actual_midcircuit_measure_count']==bits
                  assert sc['actual_midcircuit_reset_count']==bits-1
                  assert sc['actual_H_count']==2*bits
                  assert sc['actual_classical_if_else_feedback_count']==bits*(bits-1)//2
                  assert sc['all_conditional_feedback_gates_inspected']
                  assert sc['exact_feedback_angles_and_prior_classical_bit_controls']
                  assert sc['IQFT_measurements_lsb_first_in_classical_output']
                  assert sc['actual_QPU_jobs']==0
                  assert sc['physical_ISA_native_cost_not_computed']
                  schedule=sc['public_stage_build_sequence']
                  assert len(schedule)==bits
                  assert [row['stage_j'] for row in schedule]==list(range(bits-1,-1,-1))
                  assert [row['measured_classical_index'] for row in schedule]==list(range(bits))
                  for j,row in zip(range(bits-1,-1,-1),schedule):
                      expected=pow(base,2**j,35)
                      assert row['public_multiplier']==expected
                      assert row['identity_stage_skipped']==(expected==1)
                      assert row['weighted_mod35_additions']==(0 if expected==1 else 12)
                  model=item['ideal_conditional_quantum_branch_proof']
                  assert model['pass_all'] and model['source_phase_qubits_reused']==1
                  assert model['work_register_bits']==6 and model['input_work_basis_one']
                  assert model['full_work_coherence_preserved'] and model['all_histories_enumerated']
                  assert model['branch_result_count']==2**bits
                  assert model['all_stage_probability_sums_equal_one']
                  assert model['not_an_end_to_end_Qiskit_dynamic_shot_simulation']
                  assert abs(model['final_probability_sum']-1)<1e-10
                  for stage in model['stage_norm_summaries']:
                      assert abs(stage['branch_probability_sum']-1)<1e-10
                      assert stage['all_work_register_amplitudes_retained']
                  # Completely independent sparse COMPLEX work-state branch
                  # simulator (no numpy/Qiskit, no invoking original script).
                  branches={0:{1:1+0j}}
                  for j in range(bits-1,-1,-1):
                      m=pow(base,2**j,35)
                      next_branches={}
                      for history,work in branches.items():
                          mapped={}
                          for y,amplitude in work.items():
                              dest=m*y%35 if y<35 else y
                              mapped[dest]=mapped.get(dest,0j)+amplitude
                          theta=-2*math.pi*sum(
                              ((history>>(bits-1-t))&1)/(2**(t-j+1))
                              for t in range(bits-1,j,-1))
                          factor=cmath.exp(1j*theta)
                          src_support=set(work)|set(mapped)
                          plus={y:(work.get(y,0j)+factor*mapped.get(y,0j))/2 for y in src_support}
                          minus={y:(work.get(y,0j)-factor*mapped.get(y,0j))/2 for y in src_support}
                          next_branches[history]=plus
                          next_branches[history|(1<<(bits-1-j))]=minus
                      branches=next_branches
                      norm=sum(abs(a)**2 for v in branches.values() for a in v.values())
                      assert abs(norm-1)<1e-9,(base,bits,j,norm)
                  M=1<<bits
                  assert set(branches)==set(range(M))
                  check=[sum(abs(a)**2 for a in branches[k].values()) for k in range(M)]
                  old=ref['outcomes_by_phase_bits'][str(bits)]
                  original=old['exact_ideal_probabilities_all_outcomes']
                  saved=item['all_outcome_probabilities_recycled']
                  assert item['archived_wide_ideal_reference_probabilities']==original
                  assert len(original)==len(saved)==len(check)==M
                  assert item['exact_recycled_vs_wide_probability_comparisons']==M
                  assert item['all_outcomes_match_independent_wide_IQFT']
                  diff=max(abs(x-y) for x,y in zip(check,original))
                  assert diff<1e-9
                  assert max(abs(x-y) for x,y in zip(check,saved))<1e-9
                  assert item['maximum_absolute_probability_difference']<1e-9
                  assert item['quantum_gate_source_built_32_qubits']
                  assert not item['real_hardware_runtime_or_native_compilation']
                  strict=sum(p*int(row['strict_CF_convergents']['success'])
                        for p,row in zip(check,old['outcomes']))
                  bounded=sum(p*int(row['bounded_public_multiples_upto_four']['success'])
                        for p,row in zip(check,old['outcomes']))
                  assert abs(strict-item['public_factor_strict_ideal_probability'])<1e-9
                  assert abs(bounded-item['public_factor_bounded_ideal_probability'])<1e-9
                  assert item['public_factor_policy_unchanged']
                  total+=M
                  print('ORIGINAL DYNAMIC RECEIPT INDEPENDENTLY AUDITED',
                      'base',base,'precision',bits,'source_q',32,
                      'classical readout',bits,'reset',bits-1,
                      'feedback',bits*(bits-1)//2,
                      'full outcome discrepancies',diff,
                      'strict score',strict,'bounded',bounded,'ZERO QPU')
              assert total==d['total_exact_phase_outcome_probabilities_compared']==336
              print('TRUE ONE PHASE RECYCLED BASE',base,'ALL 768 SOURCE PHASE EXACT AND 336/336 WIDE-MATCHED MATHEMATICAL BRANCHES VERIFIED')
          print('SUCCESS: both ORIGINAL source-run N35 one-phase recycled dynamic circuit result artifacts independently recomputed without Qiskit or hardware')
          PY
      - name: Commit original numerical result receipts without rerunning source or model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/n35_true_recycled_phase_feedforward/qrr_n35_recycled_phase_feedforward_base2.json
          git add results/n35_true_recycled_phase_feedforward/qrr_n35_recycled_phase_feedforward_base8.json
          if ! git diff --cached --quiet; then
            git commit -m 'results: independently preserve 32q N35 true recycled-phase dynamic source and 672 exact adaptive vs wide IQFT matches, zero QPU'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
