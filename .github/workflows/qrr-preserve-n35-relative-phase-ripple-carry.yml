name: Preserve ORIGINAL N35 relative-phase ripple-carry exact-unitary and native CZ receipts

on:
  push:
    paths:
      - .github/workflows/qrr-preserve-n35-relative-phase-ripple-carry.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: qrr-n35-phase-ripple-original-receipts-v1
  cancel-in-progress: false

jobs:
  independent-artifact-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download both original untouched source-run results; DO NOT rerun circuit
        uses: actions/download-artifact@v4
        with:
          run-id: 39072693905
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: qrr-n35-phase-ripple-base*-original
          merge-multiple: true
          path: _original_ripple_source
      - name: Locate precisely two original JSON receipts without alteration
        run: |
          set -euo pipefail
          mkdir -p results/ibm_shor35_relative_phase_ripple
          for base in 2 8; do
            f="qrr_n35_relative_phase_clean_vchain_base${base}.json"
            count="$(find _original_ripple_source -type f -name "$f" | wc -l)"
            test "$count" -eq 1 || { echo "Expected one original receipt $f but got $count"; exit 1; }
            find _original_ripple_source -type f -name "$f" -exec cp -t results/ibm_shor35_relative_phase_ripple/ '{}' +
          done
      - name: Independently audit previous best, exact +1 quantum phases, actual RCCX in FULL kernel and frozen hardware failure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base_dir=Path('results/ibm_shor35_relative_phase_ripple')
          old_dir=Path('results/ibm_shor35_public_prefix_carry')
          exact={2:(9263,21772,596,160,1033),8:(9426,21933,616,162,1077)}
          for base in (2,8):
              old=json.loads((old_dir/f'qrr_n35_public_prefix_carry_base{base}.json').read_text())
              now=json.loads((base_dir/f'qrr_n35_relative_phase_clean_vchain_base{base}.json').read_text())
              assert now['revision']=='qrr-n35-relative-phase-ripple-carry-v1-20261017'
              assert now['research_lead']=='Chase Lunsford / CaMaLabs'
              assert now['preregistration']=='docs/QRR_N35_RELATIVE_PHASE_RIPPLE_CARRY_PREREG.md'
              assert now['N']==35 and now['base']==base
              assert now['kind']=='one public full-residue controlled modular multiplier'
              assert now['relative_phase_rccx_only_inside_temporary_comparator_carries'] is True
              assert now['actual_instruction_complex_phase_proof_required'] is True
              assert now['true_multiplicative_order_not_injected'] and now['orbit_not_precomputed']
              assert now['qpu_jobs_submitted']==0 and now['paid_runtime_used'] is False
              assert now['no_quantum_runtime_submission'] is True
              assert now['read_only_target']=='ibm_fez'
              assert now['frozen_transpiler_seed']==8776 and now['frozen_transpiler_optimization_level']==1
              assert now['original_compiled_baseline']==dict(
                  cz=old['native_cz'],depth=old['native_depth'],
                  primitive=old['complete_multiplier_proof']['primitive_gate_count'],
                  logical=old['application_logical_qubits'])
              p=now['comparator_phase_proof']
              assert p['pass_all'] and p['actual_gate_comparator_cases']==42672
              assert p['comparator_source_circuits']==240 and p['rccx_inside_comparator_present']
              assert p['all_carry_scratch_clean'] and p['exact_complex_phase_plus_one']
              m=now['public_modadd_phase_proof']
              assert m['pass_all'] and m['source_gate_cases']==1584 and m['unique_constants']==16
              assert m['clean_helpers'] and m['exact_complex_phase_plus_one']
              f=now['full_modmul_phase_proof']
              assert f['pass_all'] and f['full_residue_control_basis_cases']==128
              assert f['output_equals_public_modular_multiplication']
              assert f['all_25_auxiliaries_clean'] and f['exact_complex_output_phase_plus_one']
              assert f['disabled_invalid_states_identity']
              assert now['source_logical_qubits']==32
              assert now['status']=='COMPILE_SUCCESS' and now['success']
              cz,depth,rccx,ccx,cx=exact[base]
              assert now['native_cz']==cz and now['native_depth']==depth
              ops=f['quantum_source_gate_counts']
              assert ops.get('rccx',0)==rccx and ops.get('ccx',0)==ccx and ops.get('cx',0)==cx
              assert ops.get('x',0)==28
              assert now['compiled_native_ops']['cz']==now['native_cz']
              assert now['compiled_device_width']==156
              assert now['native_cz_delta']==now['native_cz']-old['native_cz']
              assert now['native_depth_delta']==now['native_depth']-old['native_depth']
              assert now['native_cz']<old['native_cz'] and now['native_depth']<old['native_depth']
              assert now['engineering_both_costs_improve'] is True
              assert now['native_cz_device_limit']==800 and now['native_depth_device_limit']==2000
              assert now['device_feasibility_gate'] is False
              print('VERIFIED ORIGINAL REAL TARGET CPU RECEIPT base',base,
                    '42,672 exact phase comparator + 1584 phase adder + 128 phase whole',
                    'RCCX in full',ops['rccx'],'CZ',old['native_cz'],'->',now['native_cz'],
                    'depth',old['native_depth'],'->',now['native_depth'],
                    'engineering win, physical gate FAIL, ZERO QPU')
          print('SUCCESS: two original source-run immutable JSONs independently audited')
          PY
      - name: Preserve only unmodified original CI JSON in research repo
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/ibm_shor35_relative_phase_ripple/qrr_n35_relative_phase_clean_vchain_base2.json
          git add results/ibm_shor35_relative_phase_ripple/qrr_n35_relative_phase_clean_vchain_base8.json
          if ! git diff --cached --quiet; then
            git commit -m 'results: independently preserve verified original N35 relative-phase comparator carry CZ improvements with exact phase proof and failed device gate'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
