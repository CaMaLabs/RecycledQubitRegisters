name: Dark Star N34 anytime original PUBLIC freeze and rho checkpoint controls ZERO QPU

on:
  push:
    paths:
      - .github/workflows/qrr-darkstar-n34-anytime-public-freeze.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: darkstar-n34-anytime-public-sha-freeze
  cancel-in-progress: false

jobs:
  original-N34-frozen-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QISKIT_IBM_TOKEN: ''
      IBM_QUANTUM_API_KEY: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Predeclared protocol and immutable public anytime source
        run: |
          set -euo pipefail
          test -s docs/DARK_STAR_N34_ANYTIME_INTERLEAVED_PREREG.md
          test "$(git hash-object integrations/darkstar_hybrid/darkstar_n34_anytime_scheduler.py)" = "afdc1e69a94ebfdd7d73fd2b6d5ada6d8c589753"
          python3 -m py_compile integrations/darkstar_hybrid/darkstar_n34_anytime_scheduler.py integrations/darkstar_hybrid/darkstar_n34_anytime_public_manifest.py integrations/darkstar_hybrid/test_darkstar_n34_anytime_scheduler.py
          if grep -nE 'qiskit_ibm_runtime|QiskitRuntimeService|SamplerV2|EstimatorV2|backend.run|job.submit' integrations/darkstar_hybrid/darkstar_n34_anytime_scheduler.py integrations/darkstar_hybrid/darkstar_n34_anytime_public_manifest.py; then
            echo 'Hardware submission forbidden'; exit 1
          fi
      - name: Pre-freeze exact checkpoint-versus-uninterrupted Brent and all method unit tests
        run: |
          set -euo pipefail
          timeout 240s python3 -m unittest integrations.darkstar_hybrid.test_darkstar_n34_anytime_scheduler -v
      - name: Generate public-only 24 N34 near/middle/far SHA-ranked original inputs, no scoring
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 1400s python3 -u -m integrations.darkstar_hybrid.darkstar_n34_anytime_public_manifest
      - name: Verify 24 original public input rows and only public SHA, no secrets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,math
          from pathlib import Path
          f=Path('results/dark_star_unified/darkstar_n34_anytime_public_frozen_manifest.json')
          m=json.loads(f.read_text())
          rows=m['original_public_rows']
          assert len(rows)==len({z['N'] for z in rows})==24
          assert m['row_SHA256']==hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert m['immutable_policy_source_sha']=='afdc1e69a94ebfdd7d73fd2b6d5ada6d8c589753'
          assert m['selection_salt']=='DARKSTAR-N34-ANYTIME-20261029'
          assert m['hidden_factors_not_in_manifest'] and m['factorization_not_performed_before_manifest_freeze']
          assert m['group_labels_are_population_metadata_not_factor_algorithm_inputs']
          assert m['zero_QPU'] and m['IBM_runtime_jobs']==0 and not m['paid_runtime_used']
          for group in ('near_0_8','middle_64_640','far_4096_16384'):
              z=[r for r in rows if r['group']==group]
              assert len(z)==8 and [r['rank'] for r in z]==list(range(1,9))
          for z in rows:
              assert (1<<33)<=z['N']<(1<<34) and math.gcd(z['N'],210)==1
              assert not any(k in z for k in ('p','q','D','order','prime_factors','score','timing'))
          print('PASS 24 ORIGINAL PUBLIC N34, FROZEN SHA',m['row_SHA256'],flush=True)
          PY
      - name: Commit original immutable N34 public SHA before scientific performance experiment
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/dark_star_unified/darkstar_n34_anytime_public_frozen_manifest.json
          git commit -m 'results: freeze original 24 N34 public-only anytime scheduler cohort before any factor outcome scoring'
          for i in 1 2 3 4 5 6 7; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo '24 N34 public inputs FROZEN on main; scoring may begin'; exit 0
            fi
            sleep 2
          done
          exit 1
