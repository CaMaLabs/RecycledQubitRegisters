name: QRR n22 full-tail freeze new public B31 survivor manifest

on:
  push:
    paths:
      - .github/workflows/qrr-n22-full-tail-public-freeze.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qrr-n22-full-tail-freeze
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate public N and base sample independently of private orders
        run: |
          python3 -u hardware/dark_star_n22_full_tail_public_manifest.py
          python3 - <<'PY'
          import json,hashlib
          p="results/dark_star_ptp/dark_star_n22_full_tail_public_manifest.json"
          x=json.load(open(p))
          rows=x["selected_public_rows"]
          assert len(rows)==4 and len({r["N"] for r in rows})==4
          assert len({r["N"] for r in rows}&set(x["previous_n22_excluded"]))==0
          canon=json.dumps(rows,sort_keys=True,separators=(",",":"))
          assert hashlib.sha256(canon.encode()).hexdigest()==x["selected_sha256"]
          assert x["zero_QPU"] and x["qpu_jobs_submitted"]==0
          assert all(set(r)=={"N","base","group","rank","public_policies"} for r in rows)
          print("Pre-outcome public manifest certified:",x["selected_sha256"])
          PY
      - name: Commit before any QPE evaluation, handle concurrent main
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/dark_star_ptp/dark_star_n22_full_tail_public_manifest.json
          git commit -m "results: freeze fresh four n22 full-QPE-tail public cases BEFORE outcomes"
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
